nname: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Part one: every test in tests/, no database. Includes the re-chunk key
  # invariants in tests/test_toy_graph_fixture.py.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            toy_graph/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q

  # Part two: the schema probe against a live Neo4j. toy_graph.py loads, reloads,
  # simulates a re-chunk, and asserts the counts never change.
  graph:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/sketchpass
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sketchpass
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            toy_graph/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Wait for Neo4j to accept connections
        working-directory: toy_graph
        run: |
          for i in $(seq 1 60); do
            python -c "import toy_graph as tg; tg.driver().verify_connectivity()" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Neo4j never accepted connections" && exit 1
      - name: Load, reload, re-chunk (fails on any duplicate)
        run: python toy_graph/toy_graph.py --reset
      - name: Reproduce the schema findings
        run: python toy_graph/check_findings.py

  # Each pipeline keeps its own requirements, so each gets its own job and a
  # clean environment. A job does nothing until its folder exists on the branch
  # being tested, so this file can merge before #34 and #35 do.

  # Exhibit 21 pipeline (#34): unit tests, then rebuild from the bundled
  # exhibits and check the committed graph edges still match the code.
  ex21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f ex21_pipeline/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ex21_pipeline/requirements.txt
      - if: steps.present.outputs.yes == 'true'
        run: pip install -r ex21_pipeline/requirements.txt pytest
      - if: steps.present.outputs.yes == 'true'
        name: Unit tests
        working-directory: ex21_pipeline
        run: pytest tests -q
      - if: steps.present.outputs.yes == 'true'
        name: Rebuild outputs from the bundled exhibits
        working-directory: ex21_pipeline
        run: python run_pipeline.py
      - if: steps.present.outputs.yes == 'true'
        name: Committed graph edges match a fresh rebuild
        # The .xlsx is not compared: Excel files embed a timestamp, so they
        # differ on every rebuild even when the data is identical.
        run: |
          git diff --exit-code -- ex21_pipeline/output/graph_edges.csv \
            || { echo "::error::graph_edges.csv is stale. Re-run run_pipeline.py and commit the result."; exit 1; }

  # Claim extraction pipeline (#35): the tests run every step over fixture
  # filings with a fake OpenAI client, so no API key and no spend.
  claims:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""   # make sure nothing can reach the real API
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f extraction_pipeline/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: extraction_pipeline/requirements.txt
      - if: steps.present.outputs.yes == 'true'
        run: pip install -r extraction_pipeline/requirements.txt pytest
      - if: steps.present.outputs.yes == 'true'
        name: Pipeline tests
        working-directory: extraction_pipeline
        run: pytest tests -q
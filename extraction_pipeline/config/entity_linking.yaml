# Linking Claims to subsidiaries and segments (step 6b builds the catalog, step 9 matches).
# Design: docs/claim-entity-linking.md (PR #91), P1 = code-only matching.

# The registrant's own names, per ticker. A mention or catalog key equal to one of these is
# the company itself, never a subsidiary or segment ("Medtronic plc", "NetApp", "Microsoft").
# Compared after match_key(): case, punctuation and legal form are ignored.
registrant_names:
  AAPL: [Apple, Apple Inc.]
  CASY: ["Casey's", "Casey's General Stores", Caseys]
  MCK: [McKesson, McKesson Corporation]
  MDT: [Medtronic, Medtronic plc]
  MSFT: [Microsoft, Microsoft Corporation]
  MU: [Micron, Micron Technology]
  NKE: [Nike, NIKE Inc.]
  NTAP: [NetApp, NetApp Inc.]
  PH: [Parker, Parker-Hannifin, Parker Hannifin Corporation]
  TTWO: [Take-Two, Take-Two Interactive, Take-Two Interactive Software]
  AMZN: [Amazon, Amazon.com, "Amazon.com, Inc."]
  GOOGL: [Alphabet, Alphabet Inc.]          # not "Google": Google LLC is a subsidiary
  WDC: [Western Digital, Western Digital Corporation]
  WMT: [Walmart, Walmart Inc.]

# Segment names that are also places or everyday words. Such a hit counts only when the
# sentence says "segment(s)", or the name is followed by one of guard_context_after
# ("Europe net sales", "Cardiovascular's net sales", "the Medical Surgical Portfolio");
# otherwise it stays needs_type_evidence_review. "Europe" in "investigations in Europe" and
# "Japan" in "imports from China, India, Japan" are places, not Apple's segments.
guard_terms:
  - Americas
  - Europe
  - Japan
  - Greater China
  - Rest of Asia Pacific
  - Asia Pacific
  - North America
  - International
  - Services
  - Products
  - Other
  - Corporate
  - Consumer
  - Enterprise
  - Commercial
  - Industrial
  - Retail
  - Cardiovascular        # Medtronic: also an adjective ("cardiovascular disease")
  - Neuroscience
  - Diabetes              # Medtronic's Diabetes segment vs "patients with diabetes"
  - Medical Surgical
  - Flash                 # Western Digital: "flash memory", "NAND flash"
  - HDD                   # Western Digital: also the product ("HDD shipments")
guard_context_after:
  - net sales
  - net revenues?
  - revenues?
  - sales
  - operating income
  - segments?
  - portfolio
  - reporting unit
  - products
  - includes
  - also includes

# XBRL members on the segment axis that are not a segment a sentence can name: totals,
# "all other", a filer's single reportable segment (Casey's), and revenue categories that
# NetApp tags on the same axis. Regexes on the member's local name ("AllOtherSegmentsMember").
segment_member_skip:
  - ^AllOtherSegments
  - ^TotalReportableSegments
  - ^ReportableSegmentAggregation
  - ^ReportableSegmentMember$
  - ^OtherOperatingSegment
  - RevenuesMember$
  - ^Other(Segment)?Member$                        # Medtronic "Other": not a reportable segment
  - ^Corporate                                     # corporate costs: WMT CorporateAndSupport, MCK Corporate
  - AndCorporateMember$                            # MCK "North American Pharmaceutical and Corporate"
  - JointVentureMember$                            # MCK German pharmaceutical wholesale joint venture
  - ^NorthAmericaAndInternationalSegmentMember$    # AMZN: North America + International subtotal
  - ^GoogleInc\.Member$                            # GOOGL: Google Inc. before the 2015 Alphabet reorganisation

# Companies with one reportable segment: no segment in the catalog, their Claims link to the
# registrant (decided). Casey's tags only us-gaap ReportableSegmentMember; Take-Two has no
# segment axis. The report does not count them under companies_without_segments.
single_segment_companies: [CASY, TTWO]

# Reviewed names for segment members, per ticker and member local name. The name built from
# the member loses punctuation ("SamsClubSegmentMember" -> "Sams Club Segment"), which never
# matches the text ("Sam's Club"). Members given the same name become one entry. Renamed or
# reorganised segments stay separate entries (decided): Sam's Club / Sam's Club U.S.
segment_names:
  AMZN:
    AmazonWebServicesSegmentMember: {name: Amazon Web Services, aliases: [AWS]}
  MCK:
    USPharmaceuticalSegmentMember: U.S. Pharmaceutical
    U.S.PharmaceuticalandSpecialtySolutionsMember: U.S. Pharmaceutical and Specialty Solutions
    PrescriptionTechnologySolutionsSegmentMember: {name: Prescription Technology Solutions, aliases: [RxTS]}
    PrescriptionTechnologySolutionsMember: {name: Prescription Technology Solutions, aliases: [RxTS]}
    RxTsSegmentMember: {name: Prescription Technology Solutions, aliases: [RxTS]}
    MedicalSurgicalSolutionsSegmentMember: Medical-Surgical Solutions
    OncologyAndMultispecialtySegmentMember: Oncology & Multispecialty
  MU:                                              # the text uses both the acronym and the full name
    CNBUMember: {name: CNBU, aliases: [Compute and Networking Business Unit]}
    MBUMember: {name: MBU, aliases: [Mobile Business Unit]}
    SBUMember: {name: SBU, aliases: [Storage Business Unit]}
    EBUMember: {name: EBU, aliases: [Embedded Business Unit]}
    CMBUMember: {name: CMBU, aliases: [Cloud Memory Business Unit]}
    CDBUMember: {name: CDBU, aliases: [Core Data Center Business Unit]}
    MCBUMember: {name: MCBU, aliases: [Mobile and Client Business Unit]}
    AEBUMember: {name: AEBU, aliases: [Automotive and Embedded Business Unit]}
  WMT:
    SamsClubSegmentMember: Sam's Club
    SamsClubMember: Sam's Club
    SamsClubUSMember: Sam's Club U.S.
    WalmartUSSegmentMember: Walmart U.S.
    WalmartUSMember: Walmart U.S.
    WalmartInternationalSegmentMember: Walmart International
    WalmartInternationalMember: Walmart International

# The dictionary pass (a catalog name found in a Claim the model did not tag) skips keys
# shorter than this, and the keys listed under dictionary_skip (too common as words).
dictionary_min_key_length: 4
dictionary_skip: []
# Short names searched all the same (whole word, capital or digit first, and not right after
# a capitalised word: "NBA 2K" is a game series).
dictionary_short_names: [2K, AWS, MBU, SBU, EBU]   # Take-Two's 2K label (2K, Inc.); Amazon Web Services; Micron business units

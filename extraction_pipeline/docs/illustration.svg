<text x="40" y="744" font-size="14.5" fill="#374151">Rows 4 and 6 are the same sentence at two places, so they are two Claims (#45). Rows 7–11 all carry the risk_lead_unit_id of row 6.</text>
<text x="40" y="768" font-size="14.5" fill="#374151">Row 8 is a merged list (one unit). Rows 9–11 are a split list (three units); each item points to row 9 by list_intro_id (dashed arrows).</text>
<text x="40" y="792" font-size="14.5" fill="#374151">Every unit under row 5 takes its themes; each of their Claims gets one CONCERNS_RISK edge per theme. Row 1, the headings and rows 12–14 are not sent to the LLM.</text>
